[supervisord]
nodaemon=true
user=root

[program:cron]
command=crond -f
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:caddy]
command=/usr/sbin/caddy run --environ --config /app/docker/Caddyfile
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
user=www
environment=HOME="/var/lib/www",USER="www"

[program:php-fpm]
command=/usr/sbin/php-fpm85 -F
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
user=www

[program:php-queue-worker]
command=/usr/bin/php85 /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
user=www
