name: Docker

on:
  workflow_dispatch:
    #
  push:
    tags:
      - '*'

env:
  # Use GitHub container registry
  REGISTRY: codeberg.org
  # github.repository as <account>/<repo>
  IMAGE_NAME: danb/rss


jobs:
  build:

    runs-on: docker
    container:
      image: node:22-bookworm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install docker
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get -qy install docker.io

      - name: Set up QEMU
        uses: https://code.forgejo.org/docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://code.forgejo.org/docker/setup-buildx-action@v3

      # https://github.com/docker/login-action
      - name: Login to Codeberg Container Registry
        uses: https://code.forgejo.org/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: https://code.forgejo.org/docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: https://code.forgejo.org/docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
